{% extends "base.html" %}
{% block content %}
<div class="row g-4">

  <!-- Sidebar -->
  <div class="col-md-3 col-lg-2">
    <div class="admin-sidebar">
      <p class="text-muted small fw-600 mb-2 text-uppercase" style="letter-spacing:.05em;font-size:.7rem;">Admin Panel</p>
      <a href="{{ url_for('admin_dashboard') }}"
         class="side-link {{ 'active' if request.endpoint=='admin_dashboard' }}">
        <i class="fa fa-chart-pie fa-sm"></i> Dashboard
      </a>
      <a href="{{ url_for('admin_users') }}"
         class="side-link {{ 'active' if request.endpoint=='admin_users' }}">
        <i class="fa fa-users fa-sm"></i> Users
      </a>
      <a href="{{ url_for('admin_resources') }}"
         class="side-link {{ 'active' if request.endpoint=='admin_resources' and not request.args.get('status') }}">
        <i class="fa fa-file-alt fa-sm"></i> Resources
      </a>
      <a href="{{ url_for('admin_resources') }}?status=pending"
         class="side-link {{ 'active' if request.endpoint=='admin_resources' and request.args.get('status')=='pending' }}">
        <i class="fa fa-clock fa-sm"></i> Pending Review
      </a>
    </div>
  </div>

  <!-- Main Content -->
  <div class="col-md-9 col-lg-10">
    {% block admin_content %}{% endblock %}
  </div>

</div>
{% endblock %}
